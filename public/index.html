<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DressyMood CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Шапка -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight">DressyMood CRM</h1>
                <p class="mt-1 text-sm text-gray-500">Панель управления заказами</p>
            </div>
            <div class="flex items-center space-x-4 w-full sm:w-auto justify-between sm:justify-end">
                <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-3 sm:space-x-4">
                    <div class="p-2 bg-blue-50 rounded-lg">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs sm:text-sm font-medium text-gray-500">Всего заказов</p>
                        <p class="text-xl sm:text-2xl font-semibold text-gray-900 leading-none" id="total-orders">0</p>
                    </div>
                </div>
                
                <!-- Кнопка Выйти -->
                <button onclick="logout()" class="text-sm font-medium text-gray-700 bg-white border border-gray-200 hover:bg-gray-50 hover:text-gray-900 px-4 py-2 rounded-xl shadow-sm transition-colors focus:ring-2 focus:ring-gray-200">
                    Выйти
                </button>
            </div>
        </div>

        <!-- Таблица -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap text-left text-sm min-w-max">
                    <thead class="bg-gray-50/80 text-gray-500 font-medium border-b border-gray-200">
                        <tr>
                            <th scope="col" class="px-6 py-4">Дата</th>
                            <th scope="col" class="px-6 py-4">Клиент</th>
                            <th scope="col" class="px-6 py-4">Артикул</th>
                            <th scope="col" class="px-6 py-4">Размер / Цвет</th>
                            <th scope="col" class="px-6 py-4">Статус</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100" id="orders-tbody">
                        <!-- Строки загружаются через JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const statusOptions = ['Новый', 'В обработке', 'Оплачен', 'Отправлен'];

        // Цвета для разных статусов
        const statusColors = {
            'Новый': 'bg-blue-100 text-blue-800',
            'В обработке': 'bg-yellow-100 text-yellow-800',
            'Оплачен': 'bg-purple-100 text-purple-800',
            'Отправлен': 'bg-green-100 text-green-800'
        };

        async function fetchOrders() {
            try {
                const response = await fetch('/api/orders');
                
                // Если не авторизован — редирект на логин
                if (response.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }

                const orders = await response.json();
                renderTable(orders);
                document.getElementById('total-orders').innerText = orders.length;
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                const tbody = document.getElementById('orders-tbody');
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Ошибка при загрузке данных</td></tr>';
            }
        }

        function renderTable(orders) {
            const tbody = document.getElementById('orders-tbody');
            tbody.innerHTML = '';

            // Проверка на пустой массив
            if (!orders || orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500 text-base font-medium">Заказов пока нет</td></tr>';
                return;
            }

            orders.forEach(order => {
                const dateObj = new Date(order.created_at);
                const dateStr = dateObj.toLocaleDateString('ru-RU') + ' <span class="text-gray-400">' + dateObj.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</span>';

                const currentStatus = order.status || 'Новый';
                
                let selectOptionsHTML = statusOptions.map(st => {
                    const selected = st === currentStatus ? 'selected' : '';
                    return `<option value="${st}" ${selected}>${st}</option>`;
                }).join('');

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="text-gray-900 font-medium">${dateStr}</div>
                        <div class="text-xs text-gray-400 mt-1">${order.source || 'Неизвестен'}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">${order.full_name}</div>
                        <div class="text-gray-500 text-sm mt-0.5">${order.phone}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-gray-100 text-gray-800">
                            ${order.article || '-'}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="text-gray-900 font-medium">${order.size || '-'}</div>
                        <div class="text-gray-500 text-sm mt-0.5">${order.color || '-'}</div>
                    </td>
                    <td class="px-6 py-4">
                        <select 
                            onchange="updateStatus(${order.order_id}, this.value, this)"
                            class="text-xs font-medium border-0 py-1.5 pl-3 pr-8 rounded-lg focus:ring-2 focus:ring-gray-300 transition-colors cursor-pointer appearance-none ${statusColors[currentStatus] || 'bg-gray-100 text-gray-800'}"
                            style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%236B7280%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right .7rem top 50%; background-size: .65rem auto;"
                        >
                            ${selectOptionsHTML}
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateStatus(orderId, newStatus, selectElement) {
            try {
                const newColorClass = statusColors[newStatus] || 'bg-gray-100 text-gray-800';
                selectElement.className = `text-xs font-medium border-0 py-1.5 pl-3 pr-8 rounded-lg focus:ring-2 focus:ring-gray-300 transition-colors cursor-pointer appearance-none ${newColorClass}`;

                const res = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }

                if (!res.ok) {
                    alert('Ошибка при обновлении статуса');
                    fetchOrders();
                }
            } catch (error) {
                console.error(error);
                alert('Ошибка сети при обновлении статуса');
                fetchOrders();
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login.html';
            } catch (error) {
                console.error('Ошибка выхода:', error);
            }
        }

        // Загружаем данные при старте
        fetchOrders();
    </script>
</body>
</html>
