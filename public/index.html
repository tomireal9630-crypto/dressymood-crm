<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления | DressyMood</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">
    <!-- Навигация -->
    <nav class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-200">
                <i class="fa-solid fa-shirt"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-800 tracking-tight leading-none">DressyMood</h1>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">CRM System v2.0</span>
            </div>
        </div>
        <div class="flex items-center gap-6 text-sm font-medium">
            <button onclick="logout()" class="text-slate-400 hover:text-rose-500 transition-all flex items-center gap-2">
                Выйти <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </nav>

    <main class="p-8 max-w-7xl mx-auto">
        <!-- Секция Статистики -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10" id="statsContainer">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-slate-400 text-xs font-bold uppercase mb-1">Всего заказов</p>
                <h3 class="text-3xl font-black text-slate-800" id="stat-total">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-blue-500">
                <p class="text-blue-400 text-xs font-bold uppercase mb-1">Новые</p>
                <h3 class="text-3xl font-black text-slate-800" id="stat-new">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-emerald-500">
                <p class="text-emerald-400 text-xs font-bold uppercase mb-1">Успешные</p>
                <h3 class="text-3xl font-black text-slate-800" id="stat-success">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-rose-500">
                <p class="text-rose-400 text-xs font-bold uppercase mb-1">Отказы</p>
                <h3 class="text-3xl font-black text-slate-800" id="stat-failed">0</h3>
            </div>
        </div>

        <!-- Управление и Поиск -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Поиск по имени, телефону или артикулу..." 
                    class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all outline-none text-sm shadow-sm"
                    oninput="debounceSearch()">
            </div>
            <button onclick="loadData()" class="w-full md:w-auto bg-white border border-slate-200 text-slate-700 px-6 py-3 rounded-xl hover:bg-slate-50 transition-all shadow-sm flex items-center justify-center gap-2 font-bold text-sm">
                <i class="fa-solid fa-arrows-rotate"></i> Обновить данные
            </button>
        </div>

        <!-- Таблица заказов -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/40 border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-200">
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Дата</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Клиент</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Товар / Цена</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">ТТН (Новая Почта)</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Статус</th>
                            <th class="px-6 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right"></th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable" class="divide-y divide-slate-100">
                        <!-- Данные загружаются динамически -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const statusConfig = {
            'Новый': 'bg-blue-50 text-blue-600 ring-blue-200',
            'В работе': 'bg-amber-50 text-amber-600 ring-amber-200',
            'Отправлен': 'bg-indigo-50 text-indigo-600 ring-indigo-200',
            'Завершен': 'bg-emerald-50 text-emerald-600 ring-emerald-200',
            'Отбой': 'bg-rose-50 text-rose-600 ring-rose-200'
        };

        let searchTimeout;

        async function loadData() {
            const search = document.getElementById('searchInput').value;
            await Promise.all([
                loadOrders(search),
                loadStats()
            ]);
        }

        async function loadStats() {
            const res = await fetch('/api/stats');
            const data = await res.json();
            document.getElementById('stat-total').innerText = data.total;
            document.getElementById('stat-new').innerText = data.new;
            document.getElementById('stat-success').innerText = data.success;
            document.getElementById('stat-failed').innerText = data.failed;
        }

        async function loadOrders(search = '') {
            try {
                const url = search ? `/api/orders?search=${encodeURIComponent(search)}` : '/api/orders';
                const res = await fetch(url);
                if (res.status === 401) return window.location.href = '/login.html';
                const orders = await res.json();
                renderOrders(orders);
            } catch (err) { console.error(err); }
        }

        function renderOrders(orders) {
            const table = document.getElementById('ordersTable');
            if (orders.length === 0) {
                table.innerHTML = `<tr><td colspan="6" class="px-6 py-20 text-center text-slate-400 text-sm italic">Ничего не найдено...</td></tr>`;
                return;
            }

            table.innerHTML = orders.map(o => `
                <tr class="hover:bg-slate-50/50 transition-colors group">
                    <td class="px-6 py-5 text-sm text-slate-400">
                        <div class="font-bold text-slate-700">${new Date(o.createdAt).toLocaleDateString('ru-RU')}</div>
                        <div class="text-[10px]">${new Date(o.createdAt).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</div>
                    </td>
                    <td class="px-6 py-5">
                        <div class="font-black text-slate-800">${o.fullName}</div>
                        <div class="text-xs text-slate-400 font-medium">${o.phone}</div>
                    </td>
                    <td class="px-6 py-5">
                        <div class="text-sm font-bold text-slate-700">${o.article}</div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 rounded text-slate-500">${o.color}</span>
                            <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 rounded text-slate-500">${o.size}</span>
                        </div>
                        <input type="number" value="${o.price}" onchange="updateField(${o.id}, 'price', this.value)"
                            class="mt-2 w-24 text-xs font-bold bg-transparent border-b border-dashed border-slate-200 focus:border-blue-500 outline-none text-slate-800"> <span class="text-[10px] text-slate-400">грн</span>
                    </td>
                    <td class="px-6 py-5">
                        <div class="relative group/ttn">
                            <input type="text" value="${o.ttn || ''}" placeholder="Введите ТТН..." 
                                onchange="updateField(${o.id}, 'ttn', this.value)"
                                class="w-full text-xs font-mono bg-slate-50 border border-slate-100 rounded-lg px-3 py-2 focus:bg-white focus:ring-2 focus:ring-blue-500/10 outline-none transition-all">
                            <i class="fa-solid fa-truck-fast absolute right-3 top-1/2 -translate-y-1/2 text-slate-300 text-[10px]"></i>
                        </div>
                    </td>
                    <td class="px-6 py-5">
                        <select onchange="updateField(${o.id}, 'status', this.value)" 
                            class="text-[11px] font-black px-3 py-2 rounded-xl ring-2 ring-inset cursor-pointer focus:outline-none transition-all ${statusConfig[o.status] || 'bg-slate-100 ring-slate-200'}">
                            ${Object.keys(statusConfig).map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s.toUpperCase()}</option>`).join('')}
                        </select>
                    </td>
                    <td class="px-6 py-5 text-right">
                        <button onclick="deleteOrder(${o.id})" class="opacity-0 group-hover:opacity-100 transition-all text-slate-300 hover:text-rose-500 p-2">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadData(), 400);
        }

        async function updateField(id, field, value) {
            const body = {};
            body[field] = value;
            await fetch(\`/api/orders/\${id}\`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            loadStats(); // Обновляем статистику, если сменили статус
        }

        async function deleteOrder(id) {
            if (!confirm('Удалить этот заказ навсегда?')) return;
            await fetch(\`/api/orders/\${id}\`, { method: 'DELETE' });
            loadData();
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        // Инициализация
        loadData();
        setInterval(loadData, 60000); // Автообновление раз в минуту
    </script>
</body>
</html>
