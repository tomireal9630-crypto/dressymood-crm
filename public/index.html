<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tomireal | Панель управління</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
        
        .sidebar-item { color: #94a3b8; transition: all 0.2s; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar-item.active { 
            background: rgba(139, 92, 246, 0.15); 
            border-left: 3px solid #8b5cf6; 
            color: white; 
        }
        .sidebar-item.active i { color: #a78bfa; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sidebar-scrollbar::-webkit-scrollbar { width: 3px; }
        .sidebar-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .view-content { display: none; }
        .view-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#f8fafc] flex h-screen overflow-hidden text-slate-700">

    <aside class="w-72 bg-[#020617] flex flex-col shrink-0 border-r border-slate-800 relative z-20">
        <div class="px-8 py-8 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-violet-600 to-fuchsia-600 rounded-xl flex items-center justify-center shadow-lg shadow-violet-500/30">
                    <i class="fa-solid fa-rocket text-white text-lg"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tighter text-white uppercase italic">tomireal</h1>
            </div>
        </div>

        <div class="px-5 flex-1 overflow-y-auto sidebar-scrollbar pb-6 space-y-8">
            <nav class="space-y-1">
                <button onclick="switchView('orders')" id="btn-orders" class="sidebar-item active w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-layer-group w-5 text-center text-slate-500"></i> Замовлення
                </button>
                <button onclick="switchView('dashboard')" id="btn-dashboard" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-slate-500"></i> Дашборд
                </button>
                <button onclick="switchView('archive')" id="btn-archive" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-box-archive w-5 text-center text-slate-500"></i> Архів
                </button>
                <button onclick="switchView('deleted')" id="btn-deleted" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-trash-can w-5 text-center text-slate-500"></i> Видалені
                </button>
            </nav>

            <nav class="space-y-1">
                <button onclick="switchView('warehouse')" id="btn-warehouse" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-warehouse w-5 text-center text-slate-500"></i> Склад
                </button>
                <button onclick="switchView('stock')" id="btn-stock" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center text-slate-500"></i> Наявність
                </button>
                <button onclick="switchView('export')" id="btn-export" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-file-export w-5 text-center text-slate-500"></i> Вигрузка
                </button>
            </nav>

            <nav class="space-y-1">
                <button onclick="switchView('stats')" id="btn-stats" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-chart-line w-5 text-center text-slate-500"></i> Статистика
                </button>
                <button onclick="switchView('users')" id="btn-users" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-users w-5 text-center text-slate-500"></i> Користувачі
                </button>
                <button onclick="switchView('settings')" id="btn-settings" class="sidebar-item w-full flex items-center gap-4 px-4 py-3 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-gear w-5 text-center text-slate-500"></i> Налаштування
                </button>
            </nav>
        </div>

        <div class="shrink-0 p-5 bg-[#020617] border-t border-slate-800">
            <div class="space-y-1 mb-4">
                <button class="sidebar-item w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-[13px] font-semibold text-left">
                    <i class="fa-solid fa-moon w-5 text-center text-slate-500"></i> Тема
                </button>
                <button onclick="logout()" class="sidebar-item w-full flex items-center gap-4 px-4 py-2.5 rounded-lg text-[13px] font-semibold text-left hover:text-rose-400">
                    <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center text-rose-500/50"></i> Вихід
                </button>
            </div>

            <div class="flex items-center gap-3 px-2 py-2 rounded-xl bg-white/5 border border-white/5">
                <div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center font-black text-white text-sm shadow-inner relative overflow-hidden">
                    <img src="https://ui-avatars.com/api/?name=tomireal&background=8b5cf6&color=fff&bold=true" alt="User" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 overflow-hidden">
                    <div class="text-[13px] font-bold text-white truncate leading-tight">tomireal</div>
                    <div class="text-[10px] text-emerald-400 font-bold uppercase tracking-widest flex items-center gap-1 mt-0.5">
                        <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div> Online
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative z-10">
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 px-10 flex items-center justify-between shrink-0 z-10">
            <div class="relative w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
                <input type="text" id="searchInput" placeholder="Швидкий пошук у базі..." 
                    class="w-full pl-11 pr-4 py-2.5 bg-slate-100 border-transparent rounded-xl focus:bg-white focus:ring-4 focus:ring-violet-500/10 focus:border-violet-500 outline-none transition-all text-sm font-medium"
                    oninput="debounceSearch()">
            </div>
            <div class="flex items-center gap-5">
                <button onclick="loadData()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-500 hover:text-violet-600 hover:bg-violet-100 transition-all">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <div class="h-8 w-px bg-slate-200"></div>
                <div class="text-right">
                    <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1" id="current-view-title">ЗАМОВЛЕННЯ</div>
                    <div class="text-[11px] text-slate-600 font-bold">Робоча область</div>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-10 custom-scrollbar bg-[#f8fafc]">
            <div id="view-orders" class="view-content active h-full flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 bg-violet-100 text-violet-600 rounded-full flex items-center justify-center mb-6 shadow-inner">
                    <i class="fa-solid fa-layer-group text-4xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter mb-2">Розділ "Замовлення"</h2>
                <p class="text-slate-500 font-medium">Дизайн готовий. Готові наповнювати таблицею?</p>
            </div>

            <div id="view-dashboard" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-chart-pie text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Дашборд"</h3>
            </div>
            <div id="view-archive" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-box-archive text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Архів"</h3>
            </div>
            <div id="view-deleted" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-trash-can text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Видалені"</h3>
            </div>
            <div id="view-warehouse" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-warehouse text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Склад"</h3>
            </div>
            <div id="view-stock" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-boxes-stacked text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Наявність"</h3>
            </div>
            <div id="view-export" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-file-export text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Вигрузка"</h3>
            </div>
            <div id="view-stats" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-chart-line text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Статистика"</h3>
            </div>
            <div id="view-users" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-users text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Користувачі"</h3>
            </div>
            <div id="view-settings" class="view-content h-full flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-gear text-6xl text-slate-200 mb-6"></i><h3 class="text-xl font-bold text-slate-400">Розділ "Налаштування"</h3>
            </div>
        </div>
    </main>

    <script>
        function switchView(view) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const btn = document.getElementById(`btn-${view}`);
            if (btn) btn.classList.add('active');

            const titles = {
                'orders': 'ЗАМОВЛЕННЯ', 'dashboard': 'ДАШБОРД', 'archive': 'АРХІВ',
                'deleted': 'ВИДАЛЕНІ', 'warehouse': 'СКЛАД', 'stock': 'НАЯВНІСТЬ',
                'export': 'ВИГРУЗКА', 'stats': 'СТАТИСТИКА', 'users': 'КОРИСТУВАЧІ', 'settings': 'НАЛАШТУВАННЯ'
            };
            document.getElementById('current-view-title').innerText = titles[view] || view.toUpperCase();

            document.querySelectorAll('.view-content').forEach(el => el.classList.remove('active'));
            const targetContent = document.getElementById(`view-${view}`);
            if (targetContent) targetContent.classList.add('active');
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        }

        function loadData() { console.log("Оновлення..."); }
        function debounceSearch() { }
    </script>
</body>
</html>
